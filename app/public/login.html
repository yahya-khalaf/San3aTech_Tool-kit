<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — San3a Academy Toolkit</title>
  <link rel="icon" type="image/png" href="/brand/favicon.png">
  <link rel="stylesheet" href="/brand/san3a-tokens.css">
  <style>
    /* San3a Academy sign-in: brand-night ground, square card, red primary button */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font: var(--s3-text-body);
      background: var(--s3-brand-night);
      padding: 24px;
    }

    .panel {
      width: min(100%, 420px);
      background: var(--s3-surface-raised);
      border-radius: var(--s3-radius-none);
      box-shadow: var(--s3-shadow-lg);
      padding: var(--s3-space-8) var(--s3-space-6);
      border: 1px solid var(--s3-border);
    }

    .panel .logo {
      display: block;
      height: 48px;
      width: auto;
      margin-bottom: var(--s3-space-6);
    }

    .panel h2 {
      font: var(--s3-text-heading-lg);
      margin: 0 0 var(--s3-space-2);
      color: var(--s3-text);
    }

    .panel p {
      color: var(--s3-text-muted);
      font: var(--s3-text-body-sm);
      margin: 0 0 var(--s3-space-5);
    }

    form {
      display: grid;
      gap: var(--s3-space-3);
    }

    input {
      width: 100%;
      min-height: 44px;
      padding: var(--s3-space-3);
      border-radius: var(--s3-radius-sm);
      border: 1px solid var(--s3-border-strong);
      font: var(--s3-text-body);
      background: var(--s3-surface-raised);
      color: var(--s3-text);
    }

    input:focus {
      outline: 2px solid var(--s3-focus-ring);
      outline-offset: 1px;
      border-color: var(--s3-focus-ring);
    }

    button {
      min-height: 44px;
      border: 2px solid transparent;
      border-radius: var(--s3-radius-sm);
      padding: var(--s3-space-3) var(--s3-space-5);
      background: var(--s3-primary);
      color: var(--s3-text-on-primary);
      font: var(--s3-text-body-strong);
      cursor: pointer;
      transition: background-color var(--s3-duration-fast);
    }

    button:hover { background: var(--s3-primary-hover); }
    button:active { background: var(--s3-primary-active); }

    button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .status {
      min-height: 20px;
      font: var(--s3-text-label);
      color: var(--s3-danger);
    }

    .s3-stripes { display: grid; grid-template-columns: repeat(8, 1fr); height: 8px; width: min(100%, 420px); }
    .s3-stripes > span:nth-child(1) { background: var(--s3-stripe-1); }
    .s3-stripes > span:nth-child(2) { background: var(--s3-stripe-2); }
    .s3-stripes > span:nth-child(3) { background: var(--s3-stripe-3); }
    .s3-stripes > span:nth-child(4) { background: var(--s3-stripe-4); }
    .s3-stripes > span:nth-child(5) { background: var(--s3-stripe-5); }
    .s3-stripes > span:nth-child(6) { background: var(--s3-stripe-6); }
    .s3-stripes > span:nth-child(7) { background: var(--s3-stripe-7); }
    .s3-stripes > span:nth-child(8) { background: var(--s3-stripe-8); }
  </style>
</head>

<body>
  <div class="panel">
    <img class="logo" src="/brand/san3a-academy-logo.png" alt="San3a Academy">
    <h2>Sign In</h2>
    <p>Enter the internal password to access this page.</p>
    <form id="loginForm">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required autofocus>
      <button type="submit" id="submitBtn">Sign In</button>
      <div class="status" id="status" aria-live="polite"></div>
    </form>
  </div>
  <div class="s3-stripes" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>

  <script>
    const form = document.getElementById('loginForm');
    const passwordInput = document.getElementById('password');
    const status = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    function nextUrl() {
      const params = new URLSearchParams(window.location.search);
      const next = params.get('next');
      if (next && next.startsWith('/') && !next.startsWith('//')) return next;
      return '/';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submitBtn.disabled = true;
      status.textContent = '';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordInput.value }),
        });

        if (response.ok) {
          window.location.href = nextUrl();
          return;
        }

        const data = await response.json().catch(() => ({}));
        status.textContent = data.error || 'Incorrect password. Please try again.';
      } catch {
        status.textContent = 'Something went wrong. Please try again.';
      } finally {
        submitBtn.disabled = false;
        passwordInput.value = '';
        passwordInput.focus();
      }
    });
  </script>
</body>

</html>
