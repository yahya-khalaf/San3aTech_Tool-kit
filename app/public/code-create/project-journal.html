<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code &amp; Create — Final Project Journals</title>
  
  <!-- San3a Typography: Montserrat (Headlines), Arvo (Sub-headlines/Chips), Inter (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  
  <!-- PapaParse for robust Quote & Multi-line Aware CSV Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    /* ==========================================================================
       SAN3A ACADEMY BRAND SYSTEM & TOKENS
       ========================================================================== */
    :root {
      --ink: #240D18;
      --plum: #3D1221;
      --maroon: #781629;
      --red: #CF2027;
      --bg: #FFF7F3;
      --sun: #FFC93C;
      --teal: #2EC4B6;
      --card: #FFFFFF;
      --shadow-sm: 0 4px 12px rgba(36, 13, 24, 0.05);
      --shadow-md: 0 10px 30px rgba(36, 13, 24, 0.08);
      --shadow-lg: 0 18px 40px rgba(36, 13, 24, 0.15);
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: 60px;
      overflow-x: hidden;
    }

    /* Top Accent Line */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--ink), var(--plum), var(--maroon), var(--red), var(--sun));
      z-index: 1000;
    }

    h1, h2, h3, h4, .brand-heading {
      font-family: 'Montserrat', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sub-heading {
      font-family: 'Arvo', Georgia, serif;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Direction Helper */
    [dir="rtl"] {
      text-align: right;
      direction: rtl;
    }

    /* ==========================================================================
       PERSISTENT HEADER & COHORT STATS
       ========================================================================== */
    header {
      background: linear-gradient(135deg, var(--ink), var(--plum));
      color: #FFFFFF;
      padding: 32px 0 24px;
      box-shadow: var(--shadow-md);
      margin-bottom: 28px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-slot {
      height: 52px;
      display: flex;
      align-items: center;
    }

    .logo-slot img {
      height: 52px;
      object-fit: contain;
    }

    .brand-text h1 {
      font-size: 24px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.1;
    }

    .brand-text h1 span {
      color: var(--red);
    }

    .brand-tagline {
      font-size: 11px;
      color: var(--sun);
      letter-spacing: 2px;
      font-weight: 700;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--red);
      color: #FFFFFF;
      border: none;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      font-family: 'Arvo', Georgia, serif;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: var(--maroon);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: var(--sun);
      color: var(--ink);
      border-color: var(--sun);
    }

    /* Cohort Summary Bar */
    .cohort-summary {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .summary-stats {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
    }

    .summary-stats strong {
      color: var(--sun);
      font-size: 16px;
    }

    .theme-dist-bar {
      display: flex;
      height: 10px;
      width: 220px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.1);
    }

    .theme-segment {
      height: 100%;
      transition: width 0.5s ease;
    }

    /* ==========================================================================
       FILTER CONTROLS BAR
       ========================================================================== */
    .controls-card {
      background: var(--card);
      border-radius: var(--radius-md);
      padding: 18px 24px;
      box-shadow: var(--shadow-md);
      margin-bottom: 28px;
      border: 1px solid rgba(36, 13, 24, 0.06);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: minmax(160px, 1fr) 2fr minmax(200px, 1.2fr) auto;
      gap: 16px;
      align-items: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-group label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--plum);
      font-family: 'Arvo', Georgia, serif;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1.5px solid rgba(36, 13, 24, 0.15);
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--red);
      background: var(--card);
    }

    .theme-chips-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filter-chip {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid transparent;
      opacity: 0.65;
      transition: all 0.2s ease;
      font-family: 'Arvo', Georgia, serif;
      user-select: none;
    }

    .filter-chip.active {
      opacity: 1;
      transform: scale(1.04);
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    /* Theme Chips Branding */
    .chip-env { background: rgba(46, 196, 182, 0.18); color: #16655D; border-color: var(--teal); }
    .chip-env.active { background: var(--teal); color: var(--ink); }

    .chip-health { background: rgba(207, 32, 39, 0.15); color: var(--maroon); border-color: var(--red); }
    .chip-health.active { background: var(--red); color: #FFFFFF; }

    .chip-arts { background: rgba(255, 201, 60, 0.25); color: #8A6100; border-color: var(--sun); }
    .chip-arts.active { background: var(--sun); color: var(--ink); }

    .chip-edu { background: rgba(120, 22, 41, 0.15); color: var(--maroon); border-color: var(--maroon); }
    .chip-edu.active { background: var(--maroon); color: #FFFFFF; }

    .chip-access { background: rgba(61, 18, 33, 0.15); color: var(--plum); border-color: var(--plum); }
    .chip-access.active { background: var(--plum); color: #FFFFFF; }

    /* ==========================================================================
       GALLERY GRID VIEW
       ========================================================================== */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .project-card {
      background: var(--card);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(36, 13, 24, 0.06);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      position: relative;
    }

    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .card-cover {
      height: 180px;
      width: 100%;
      background: linear-gradient(135deg, var(--plum), var(--maroon));
      position: relative;
      overflow: hidden;
    }

    .card-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-cover-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      color: rgba(255, 255, 255, 0.3);
    }

    .card-top-tags {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .group-badge {
      background: var(--ink);
      color: var(--sun);
      font-size: 10px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 1px;
      font-family: 'Arvo', Georgia, serif;
    }

    .card-themes {
      display: flex;
      gap: 4px;
    }

    .card-body {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .card-blurb {
      font-size: 13px;
      color: var(--plum);
      line-height: 1.45;
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-spec-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid rgba(36, 13, 24, 0.06);
      font-size: 11px;
      font-weight: 700;
      color: var(--maroon);
    }

    .mini-pill {
      background: var(--bg);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(36, 13, 24, 0.08);
    }

    .card-members {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      font-size: 12px;
      color: #6B5B63;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ==========================================================================
       JOURNAL DETAIL VIEW
       ========================================================================== */
    .journal-detail {
      display: none;
      animation: fadeIn 0.3s ease forwards;
    }

    .journal-detail.active {
      display: block;
    }

    .btn-back-nav {
      margin-bottom: 20px;
    }

    .journal-stack {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .journal-section {
      background: var(--card);
      border-radius: var(--radius-lg);
      padding: 36px;
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(36, 13, 24, 0.06);
      scroll-margin-top: 20px;
    }

    .journal-hero {
      border-top: 8px solid var(--red);
    }

    .journal-title-area h1 {
      font-size: 36px;
      color: var(--ink);
      font-weight: 900;
      margin-top: 8px;
      margin-bottom: 12px;
      line-height: 1.15;
    }

    .roster-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .roster-pill {
      background: var(--bg);
      color: var(--ink);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(36, 13, 24, 0.1);
    }

    .hero-media-wrap {
      width: 100%;
      max-height: 420px;
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-top: 24px;
      background: var(--ink);
    }

    .hero-media-wrap img {
      width: 100%;
      height: 100%;
      max-height: 420px;
      object-fit: cover;
    }

    /* Spec Checklist Panel */
    .spec-panel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    .spec-badge-card {
      background: var(--bg);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      border: 1.5px solid rgba(36, 13, 24, 0.08);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .spec-badge-card.met {
      border-color: var(--teal);
      background: rgba(46, 196, 182, 0.08);
    }

    .spec-badge-card.amber {
      border-color: var(--sun);
      background: rgba(255, 201, 60, 0.12);
    }

    .spec-status-icon {
      font-size: 24px;
    }

    .spec-details h4 {
      font-size: 12px;
      color: var(--maroon);
      font-family: 'Arvo', Georgia, serif;
    }

    .spec-details div {
      font-size: 15px;
      font-weight: 800;
      color: var(--ink);
    }

    /* Design Thinking 5-Step Flow */
    .dt-flow-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .dt-step-card {
      background: var(--bg);
      border-radius: var(--radius-md);
      padding: 20px;
      border-top: 5px solid var(--maroon);
      position: relative;
    }

    .dt-step-card.emphasized {
      border-top-color: var(--red);
      background: #FFFFFF;
      box-shadow: var(--shadow-md);
      transform: scale(1.02);
    }

    .dt-step-num {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 6px;
      font-family: 'Arvo', Georgia, serif;
    }

    .dt-step-card h3 {
      font-size: 15px;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .dt-step-card p {
      font-size: 13px;
      color: var(--plum);
      line-height: 1.5;
    }

    /* Building Steps Timeline */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 20px;
    }

    .timeline-item {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .timeline-num {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--red);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      flex-shrink: 0;
    }

    .timeline-content {
      background: var(--bg);
      padding: 14px 18px;
      border-radius: var(--radius-md);
      flex: 1;
      font-size: 14px;
      color: var(--ink);
      border: 1px solid rgba(36, 13, 24, 0.06);
    }

    /* Code Block Area */
    .code-box-wrap {
      background: var(--ink);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-top: 16px;
      box-shadow: var(--shadow-md);
    }

    .code-box-header {
      background: var(--plum);
      color: var(--sun);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      font-family: 'Arvo', Georgia, serif;
    }

    pre.code-block {
      color: #FFEAEA;
      padding: 20px;
      font-family: 'SF Mono', Consolas, Monaco, monospace;
      font-size: 13.5px;
      line-height: 1.5;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Gallery Grid in Journal */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .media-thumb {
      aspect-ratio: 4/3;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--ink);
      cursor: pointer;
    }

    .media-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.2s;
    }

    .media-thumb:hover img {
      transform: scale(1.05);
    }

    .journal-footer-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid rgba(36, 13, 24, 0.1);
    }

    /* ==========================================================================
       AUTO-SCROLL EXHIBITION PRESENTATION MODE
       ========================================================================== */
    body.presenting {
      background: var(--ink) !important;
      color: #FFFFFF !important;
    }

    body.presenting header,
    body.presenting .controls-card,
    body.presenting .btn-back-nav,
    body.presenting .journal-footer-nav {
      display: none !important;
    }

    body.presenting .journal-section {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      padding: 48px;
    }

    body.presenting .journal-section h1,
    body.presenting .journal-section h2,
    body.presenting .journal-section h3,
    body.presenting .dt-step-card h3 {
      color: #FFFFFF;
    }

    body.presenting .dt-step-card,
    body.presenting .spec-badge-card,
    body.presenting .timeline-content {
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.12);
    }

    body.presenting .card-blurb,
    body.presenting .dt-step-card p {
      color: rgba(255, 255, 255, 0.8);
    }

    .present-overlay-controls {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(36, 13, 24, 0.92);
      border: 1px solid rgba(255, 201, 60, 0.4);
      padding: 10px 20px;
      border-radius: 999px;
      z-index: 2000;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    body.presenting .present-overlay-controls {
      display: flex;
    }

    .present-speed-btn {
      background: rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .present-speed-btn.active {
      background: var(--sun);
      color: var(--ink);
    }

    /* Lightbox Modal */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(36, 13, 24, 0.94);
      z-index: 3000;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .lightbox.active { display: flex; }

    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .lightbox-close {
      position: absolute;
      top: 24px; right: 24px;
      color: #FFFFFF;
      font-size: 36px;
      cursor: pointer;
    }

    /* Animations & Utilities */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .preview-ribbon {
      background: var(--sun);
      color: var(--ink);
      font-size: 11px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Responsive Breaks */
    @media (max-width: 1024px) {
      .projects-grid { grid-template-columns: repeat(2, 1fr); }
      .controls-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 720px) {
      .projects-grid { grid-template-columns: 1fr; }
      .controls-grid { grid-template-columns: 1fr; }
      .journal-section { padding: 22px; }
      .journal-title-area h1 { font-size: 26px; }
    }
  </style>
</head>
<body>

  <!-- Persistent Header -->
  <header>
    <div class="container">
      <div class="header-top">
        <div class="brand-lockup">
          <div class="logo-slot">
            <img id="san3aLogo" src="https://drive.google.com/thumbnail?id=1rCKa03biw85Q-7LveerNCSz1WY00rbc8&amp;sz=w1000" alt="San3a Academy Logo">
          </div>
          <div class="brand-text">
            <h1>CODE &amp; <span>CREATE</span></h1>
            <div class="brand-tagline">ZERO TO MAKER • FINAL PROJECT JOURNALS</div>
          </div>
        </div>
        <div class="header-actions">
          <span id="previewRibbon" class="preview-ribbon" style="display:none;">MOCK DATA PREVIEW</span>
          <button class="btn btn-secondary" id="refreshBtn" onclick="fetchData()">🔄 Refresh</button>
          <button class="btn" onclick="togglePresentationMode()">📺 Present</button>
        </div>
      </div>

      <!-- Cohort Summary Glance -->
      <div class="cohort-summary">
        <div class="summary-stats">
          <span>Total Projects: <strong id="statTotalProjects">—</strong></span>
          <span>Participating Teams: <strong id="statTotalTeams">—</strong></span>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <span style="font-size:11px; text-transform:uppercase; letter-spacing:1px; color:rgba(255,255,255,0.7); font-family:'Arvo', serif;">Theme Mix:</span>
          <div class="theme-dist-bar" id="themeDistBar"></div>
        </div>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- Controls Bar -->
    <section class="controls-card">
      <div class="controls-grid">
        <div class="control-group">
          <label for="groupSelect">1. Cohort Group</label>
          <select id="groupSelect" onchange="handleFilterChange()">
            <option value="ALL">All Groups (#1–#8)</option>
          </select>
        </div>

        <div class="control-group">
          <label>2. Filter by Theme</label>
          <div class="theme-chips-filter">
            <span class="filter-chip chip-env" data-theme="Environment" onclick="toggleThemeFilter(this)">🌱 Environment</span>
            <span class="filter-chip chip-health" data-theme="Health &amp; Wellbeing" onclick="toggleThemeFilter(this)">❤️ Health</span>
            <span class="filter-chip chip-arts" data-theme="Arts &amp; Culture" onclick="toggleThemeFilter(this)">🎨 Arts</span>
            <span class="filter-chip chip-edu" data-theme="Education" onclick="toggleThemeFilter(this)">📚 Education</span>
            <span class="filter-chip chip-access" data-theme="Disabilities &amp; Accessibility" onclick="toggleThemeFilter(this)">♿ Accessibility</span>
          </div>
        </div>

        <div class="control-group">
          <label for="searchInput">3. Search Projects</label>
          <input type="text" id="searchInput" placeholder="Search keywords, users, or problems..." oninput="handleFilterChange()">
        </div>

        <div class="control-group" style="text-align:right;">
          <button class="btn" style="background:var(--ink); color:var(--sun);" onclick="togglePresentationMode()">▶ Start Exhibition</button>
        </div>
      </div>
    </section>

    <!-- Gallery Grid View -->
    <section id="galleryView">
      <div id="projectsGrid" class="projects-grid"></div>
    </section>

    <!-- Project Journal Detail View -->
    <section id="detailView" class="journal-detail">
      <button class="btn btn-secondary btn-back-nav" onclick="showGallery()">← Back to Project Gallery</button>
      <div id="journalContent" class="journal-stack"></div>
    </section>

  </main>

  <!-- Exhibition Auto-Scroll Controls Overlay -->
  <div class="present-overlay-controls" id="presentOverlay">
    <button class="btn btn-secondary" onclick="prevPresentationSection()">⏮ Prev</button>
    <button class="btn" id="presentPlayPauseBtn" onclick="togglePausePresentation()">⏸ Pause</button>
    <button class="btn btn-secondary" onclick="nextPresentationSection()">Next ⏭</button>
    <span style="color:var(--sun); font-size:12px; font-weight:bold;">Speed:</span>
    <button class="present-speed-btn" onclick="setPresentSpeed(22000, this)">Slow</button>
    <button class="present-speed-btn active" onclick="setPresentSpeed(14000, this)">Norm</button>
    <button class="present-speed-btn" onclick="setPresentSpeed(8000, this)">Fast</button>
    <button class="btn" style="background:var(--red); margin-left:12px;" onclick="togglePresentationMode()">❌ Exit</button>
  </div>

  <!-- Lightbox Modal -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightboxImg" src="" alt="Project Photo Preview">
  </div>

  <script>
    /* ==========================================================================
       DATA CONTROLLER & CONFIG
       ========================================================================== */
    const CSV_URL = ""; // Set live published CSV URL here

    const THEME_MAP = {
      "Environment": { color: "var(--teal)", icon: "🌱", class: "chip-env" },
      "Health & Wellbeing": { color: "var(--red)", icon: "❤️", class: "chip-health" },
      "Arts & Culture": { color: "var(--sun)", icon: "🎨", class: "chip-arts" },
      "Education": { color: "var(--maroon)", icon: "📚", class: "chip-edu" },
      "Disabilities & Accessibility": { color: "var(--plum)", icon: "♿", class: "chip-access" }
    };

    // Schema mapped mock data (§10)
    const MOCK_DATA = [
      {
        "group": "Group #6",
        "project": "الجراج الذكي (Smart Garage)",
        "members": ["شهد عادل", "فتحي زكريا", "فادى يوسف"],
        "themes": ["Disabilities & Accessibility"],
        "description": "A garage with two auto-doors for elderly and disabled drivers.",
        "user": "Elderly people and people with disabilities",
        "problem": "Opening the garage door manually is hard and risky for them.",

        "why": "Serves both the car and the person automatically, no manual effort.",
        "inputs": ["Ultrasonic", "IR sensor"],
        "outputs": ["Servo", "Servo", "Display"],
        "extra": ["Ultrasonic", "IR", "Servo"],
        "enclosure": "Cardboard garage with two hinged doors",
        "steps": ["Prototype doors in cardboard", "Wire ultrasonic to P1/P2", "Add IR side door", "Tune distances", "Test with a toy car"],
        "functionality": "Car door opens within 0.5m; side door opens when a person approaches.",
        "challenges": "Servo power dip when both doors move together.",
        "code": "from microbit import *\n# Smart Garage Code\nwhile True:\n    if pin1.read_digital() == 0:\n        display.show(Image.YES)",
        "photos": ["https://drive.google.com/thumbnail?id=1K1Jtp_lEwVGHrVHd5ygwCMaHLOHLFfjd&sz=w1000"]
      },
      {
        "group": "Group #1",
        "project": "Smart Electricity Switch",
        "members": ["محمد عبد الخالق", "عمر محمد على"],
        "themes": ["Environment"],
        "description": "A micro:bit that flips a real light switch to cut wasted power.",
        "user": "Anyone in a home or office",
        "problem": "Lights left on waste electricity.",
        "suggested": ["Manual remote only", "Auto light sensing", "Both combined"],
        "selected": "A servo flips the switch; a remote micro:bit sends radio commands; LDR auto-off in daylight.",
        "why": "Covers both manual control and automatic saving.",
        "inputs": ["LDR", "Radio / Button"],
        "outputs": ["Servo", "Radio", "Display"],
        "extra": ["Servo", "LDR"],
        "enclosure": "Cardboard wall panel with a real switch",
        "steps": ["Build wall panel", "Mount servo on switch", "Set up radio pair", "Add LDR auto mode", "Calibrate light threshold"],
        "functionality": "Press remote to toggle; auto-off when the room is bright.",
        "challenges": "Aligning the servo arm precisely with the switch.",
        "code": "",
        "photos": []
      },
      {
        "group": "Group #7",
        "project": "Braille Learning Device",
        "members": ["تبارك محمد", "احمد اسماعيل", "عبد الرحمن عاطف"],
        "themes": ["Education", "Disabilities & Accessibility"],
        "description": "A device that helps blind students practise Braille independently.",
        "user": "Blind and visually-impaired students",
        "problem": "Learning Braille needs constant teacher help.",
        "suggested": ["Flashcards", "Audio-only app", "Tactile buttons + feedback"],
        "selected": "Buttons/touch inputs to enter a letter; sound + vibration feedback; score tracking.",
        "why": "Lets students practise alone with instant feedback.",
        "inputs": ["Button A", "Button B", "Touch logo"],
        "outputs": ["Speaker", "Display"],
        "extra": [],
        "enclosure": "Cardboard console with labelled buttons",
        "steps": ["Map buttons to Braille cells", "Add feedback sounds", "Build scoring variable", "Add difficulty levels", "User-test with a peer"],
        "functionality": "Enter a letter → device confirms correct/incorrect and tracks a score.",
        "challenges": "Representing 6-dot Braille with limited buttons.",
        "code": "",
        "photos": []
      }
    ];

    let projectsData = [];
    let filteredProjects = [];
    let activeProjectIndex = -1;
    let selectedThemes = new Set();

    // Exhibition Presentation State
    let isPresenting = false;
    let isPaused = false;
    let presentSpeed = 14000;
    let autoScrollInterval = null;
    let currentSectionIndex = 0;

    window.addEventListener('DOMContentLoaded', () => {
      fetchData();
      setupKeyboardListeners();
      
      const params = new URLSearchParams(window.location.search);
      if (params.get('present') === '1') {
        setTimeout(togglePresentationMode, 600);
      }
    });

    /* ==========================================================================
       DATA PARSING & NORMALIZATION
       ========================================================================== */
    function fetchData() {
      if (!CSV_URL) {
        document.getElementById('previewRibbon').style.display = 'inline-block';
        processParsedData(MOCK_DATA);
        return;
      }

      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          const raw = results.data.map(row => {
            const cleanRow = {};
            Object.keys(row).forEach(k => cleanRow[k.trim()] = row[k]);
            
            return {
              group: cleanRow['Group number'] || 'Group #1',
              project: cleanRow['Project name'] || 'Untitled Project',
              members: (cleanRow['Team members'] || '').split(',').map(m => m.trim()).filter(Boolean),
              themes: (cleanRow['Theme'] || '').split(',').map(t => t.trim()).filter(Boolean),
              description: cleanRow['Short description'] || '',
              user: cleanRow['Target user'] || '',
              problem: cleanRow['Problem'] || '',
              suggested: (cleanRow['Suggested solutions'] || '').split('\n').map(s => s.trim()).filter(Boolean),
              selected: cleanRow['Selected solution'] || '',
              why: cleanRow['Why this solution'] || '',
              inputs: (cleanRow['Inputs used'] || '').split(',').map(i => i.trim()).filter(Boolean),
              outputs: (cleanRow['Outputs used'] || '').split(',').map(o => o.trim()).filter(Boolean),
              extra: (cleanRow['Extra components'] || '').split(',').map(e => e.trim()).filter(Boolean),
              enclosure: cleanRow['Enclosure'] || '',
              steps: (cleanRow['Building steps'] || '').split('\n').map(s => s.trim()).filter(Boolean),
              functionality: cleanRow['Final functionality'] || '',
              challenges: cleanRow['Challenges'] || '',
              code: cleanRow['Code source'] || '',
              photos: parseDriveLinks(cleanRow['Photos'] || '')
            };
          });
          processParsedData(raw);
        },
        error: function(err) {
          console.warn('CSV load failed, using mock data:', err);
          document.getElementById('previewRibbon').style.display = 'inline-block';
          processParsedData(MOCK_DATA);
        }
      });
    }

    function processParsedData(data) {
      projectsData = data;
      populateGroupDropdown();
      updateCohortSummary();
      handleFilterChange();
    }

    function parseDriveLinks(rawStr) {
      if (!rawStr) return [];
      const idSet = new Set();
      const regex = /(?:id=|\/d\/|\/file\/d\/)([a-zA-Z0-9_-]{20,})/g;
      let match;
      while ((match = regex.exec(rawStr)) !== null) {
        if (match[1]) idSet.add(`https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`);
      }
      return Array.from(idSet);
    }

    /* ==========================================================================
       FILTERS & SUMMARY CONTROLLER
       ========================================================================== */
    function populateGroupDropdown() {
      const groups = [...new Set(projectsData.map(p => p.group))].sort();
      const select = document.getElementById('groupSelect');
      select.innerHTML = '<option value="ALL">All Groups (#1–#8)</option>';
      groups.forEach(g => {
        select.innerHTML += `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`;
      });
    }

    function toggleThemeFilter(chip) {
      const theme = chip.getAttribute('data-theme');
      if (selectedThemes.has(theme)) {
        selectedThemes.delete(theme);
        chip.classList.remove('active');
      } else {
        selectedThemes.add(theme);
        chip.classList.add('active');
      }
      handleFilterChange();
    }

    function handleFilterChange() {
      const groupVal = document.getElementById('groupSelect').value;
      const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();

      filteredProjects = projectsData.filter(p => {
        const matchGroup = groupVal === 'ALL' || p.group === groupVal;
        const matchTheme = selectedThemes.size === 0 || p.themes.some(t => selectedThemes.has(t));
        const matchSearch = !searchVal || 
          p.project.toLowerCase().includes(searchVal) ||
          p.user.toLowerCase().includes(searchVal) ||
          p.problem.toLowerCase().includes(searchVal) ||
          p.members.some(m => m.toLowerCase().includes(searchVal));

        return matchGroup && matchTheme && matchSearch;
      });

      renderGallery();
    }

    function updateCohortSummary() {
      document.getElementById('statTotalProjects').innerText = projectsData.length;
      document.getElementById('statTotalTeams').innerText = new Set(projectsData.map(p => p.group + p.project)).size;

      // Theme distribution bar
      const themeCounts = {};
      Object.keys(THEME_MAP).forEach(t => themeCounts[t] = 0);
      projectsData.forEach(p => p.themes.forEach(t => { if (themeCounts[t] !== undefined) themeCounts[t]++; }));
      
      const totalThemeRefs = Object.values(themeCounts).reduce((a, b) => a + b, 0) || 1;
      const bar = document.getElementById('themeDistBar');
      bar.innerHTML = Object.entries(themeCounts).map(([theme, count]) => {
        const pct = (count / totalThemeRefs) * 100;
        return `<div class="theme-segment" style="width:${pct}%; background:${THEME_MAP[theme].color}" title="${theme}: ${count}"></div>`;
      }).join('');
    }

    /* ==========================================================================
       VIEW RENDERERS (GALLERY & DETAIL)
       ========================================================================== */
    function renderGallery() {
      showGalleryView();
      const grid = document.getElementById('projectsGrid');
      
      if (filteredProjects.length === 0) {
        grid.innerHTML = `
          <div style="grid-column:1/-1; text-align:center; padding:60px 20px; background:var(--card); border-radius:var(--radius-md);">
            <h3>No Project Journals Found</h3>
            <p style="color:var(--plum); margin-top:6px;">Try adjusting your group, theme, or search filters.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filteredProjects.map((p, idx) => {
        const coverImg = p.photos.length > 0 ? `<img src="${p.photos[0]}" alt="${escapeHtml(p.project)}" loading="lazy">` : `<div class="card-cover-placeholder">🛠️</div>`;
        const isRtl = isArabic(p.project);

        return `
          <article class="project-card" onclick="openJournal(${idx})">
            <div class="card-cover">
              ${coverImg}
              <div class="card-top-tags">
                <span class="group-badge">${escapeHtml(p.group)}</span>
                <div class="card-themes">
                  ${p.themes.map(t => `<span class="filter-chip ${THEME_MAP[t]?.class || ''} active" style="font-size:9px; padding:3px 8px;">${THEME_MAP[t]?.icon || '💡'}</span>`).join('')}
                </div>
              </div>
            </div>

            <div class="card-body" ${isRtl ? 'dir="rtl"' : ''}>
              <h2 class="card-title">${escapeHtml(p.project)}</h2>
              <p class="card-blurb">${escapeHtml(p.description || p.problem)}</p>
              
              <div class="card-spec-row">
                <span class="mini-pill">📥 ${p.inputs.length} Inputs</span>
                <span class="mini-pill">💡 ${p.outputs.length} Outputs</span>
                ${p.enclosure ? `<span class="mini-pill">📦 Cardboard</span>` : ''}
              </div>

              <div class="card-members">
                👥 ${p.members.map(m => escapeHtml(m)).join(', ')}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function openJournal(filteredIdx) {
      activeProjectIndex = filteredIdx;
      const p = filteredProjects[filteredIdx];
      if (!p) return;

      hideGalleryView();
      const content = document.getElementById('journalContent');
      const isArabicProject = isArabic(p.project + p.description);

      // Verify Inputs / Outputs (>=2 rule)
      const inputsMet = p.inputs.length >= 2;
      const outputsMet = p.outputs.length >= 2;

      content.innerHTML = `
        <!-- Section 1: Hero -->
        <section class="journal-section journal-hero" ${isArabicProject ? 'dir="rtl"' : ''}>
          <div style="display:flex; justify-shadow:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;">
            <div>
              <span class="group-badge" style="font-size:12px; padding:6px 14px;">${escapeHtml(p.group)}</span>
              <div style="display:inline-flex; gap:6px; margin-left:10px;">
                ${p.themes.map(t => `<span class="filter-chip ${THEME_MAP[t]?.class || ''} active">${THEME_MAP[t]?.icon || ''} ${escapeHtml(t)}</span>`).join('')}
              </div>
            </div>
          </div>

          <div class="journal-title-area">
            <h1>${escapeHtml(p.project)}</h1>
            <p class="sub-heading" style="font-size:18px; color:var(--maroon);">${escapeHtml(p.description)}</p>
          </div>

          <div class="roster-pills">
            ${p.members.map(m => `<span class="roster-pill">👤 ${escapeHtml(m)}</span>`).join('')}
          </div>

          ${p.photos.length > 0 ? `
            <div class="hero-media-wrap">
              <img src="${p.photos[0]}" alt="${escapeHtml(p.project)}" onclick="openLightbox('${p.photos[0]}')">
            </div>
          ` : ''}
        </section>

        <!-- Section 2: Requirements Spec Panel -->
        <section class="journal-section">
          <h2 class="brand-heading" style="font-size:20px; color:var(--ink);">Verifiable Requirements Spec</h2>
          <div class="spec-panel-grid">
            <div class="spec-badge-card ${inputsMet ? 'met' : 'amber'}">
              <div class="spec-status-icon">${inputsMet ? '✅' : '⚠️'}</div>
              <div class="spec-details">
                <h4>INPUTS (${p.inputs.length}/2)</h4>
                <div>${escapeHtml(p.inputs.join(', ') || 'None')}</div>
              </div>
            </div>

            <div class="spec-badge-card ${outputsMet ? 'met' : 'amber'}">
              <div class="spec-status-icon">${outputsMet ? '✅' : '⚠️'}</div>
              <div class="spec-details">
                <h4>OUTPUTS (${p.outputs.length}/2)</h4>
                <div>${escapeHtml(p.outputs.join(', ') || 'None')}</div>
              </div>
            </div>

            <div class="spec-badge-card met">
              <div class="spec-status-icon">✅</div>
              <div class="spec-details">
                <h4>CORE HARDWARE</h4>
                <div>micro:bit V2 + Python</div>
              </div>
            </div>

            <div class="spec-badge-card ${p.enclosure ? 'met' : 'amber'}">
              <div class="spec-status-icon">${p.enclosure ? '📦' : '⚠️'}</div>
              <div class="spec-details">
                <h4>ENCLOSURE</h4>
                <div>${escapeHtml(p.enclosure || 'Pending Cardboard Build')}</div>
              </div>
            </div>
          </div>

          ${p.extra.length > 0 ? `
            <div style="margin-top:16px; font-size:13px; font-weight:700; color:var(--plum);">
              ⚡ Extra Components Used: ${p.extra.map(e => getComponentBadge(e)).join(' ')}
            </div>
          ` : ''}
        </section>

        <!-- Section 3: Design Thinking 5-Step Flow -->
        <section class="journal-section" ${isArabic(p.user + p.problem) ? 'dir="rtl"' : ''}>
          <h2 class="brand-heading" style="font-size:20px; color:var(--ink);">Design-Thinking Process</h2>
          <div class="dt-flow-grid">
            <div class="dt-step-card">
              <div class="dt-step-num">STEP 1 • USER</div>
              <h3>👤 Target User</h3>
              <p>${escapeHtml(p.user || 'N/A')}</p>
            </div>

            <div class="dt-step-card">
              <div class="dt-step-num">STEP 2 • PROBLEM</div>
              <h3>❓ Problem Statement</h3>
              <p>${escapeHtml(p.problem || 'N/A')}</p>
            </div>

            <div class="dt-step-card">
              <div class="dt-step-num">STEP 3 • IDEATE</div>
              <h3>💡 Ideas Explored</h3>
              <p>${p.suggested.map(s => `• ${escapeHtml(s)}`).join('<br>') || 'N/A'}</p>
            </div>

            <div class="dt-step-card emphasized">
              <div class="dt-step-num">STEP 4 • PROTOTYPE</div>
              <h3>✅ Selected Solution</h3>
              <p><strong>${escapeHtml(p.selected || 'N/A')}</strong></p>
            </div>

            <div class="dt-step-card">
              <div class="dt-step-num">STEP 5 • RATIONALE</div>
              <h3>🎯 Why Chosen</h3>
              <p>${escapeHtml(p.why || 'N/A')}</p>
            </div>
          </div>
        </section>

        <!-- Section 4: How It Works -->
        ${p.functionality ? `
          <section class="journal-section" ${isArabic(p.functionality) ? 'dir="rtl"' : ''}>
            <h2 class="brand-heading" style="font-size:20px; color:var(--ink);">How It Works</h2>
            <p style="font-size:16px; color:var(--plum); line-height:1.6; margin-top:10px;">
              ${escapeHtml(p.functionality)}
            </p>
          </section>
        ` : ''}

        <!-- Section 5: Building Timeline -->
        ${p.steps.length > 0 ? `
          <section class="journal-section" ${isArabic(p.steps.join(' ')) ? 'dir="rtl"' : ''}>
            <h2 class="brand-heading" style="font-size:20px; color:var(--ink);">Maker Building Timeline</h2>
            <div class="timeline">
              ${p.steps.map((step, idx) => `
                <div class="timeline-item">
                  <div class="timeline-num">${idx + 1}</div>
                  <div class="timeline-content">${escapeHtml(step)}</div>
                </div>
              `).join('')}
            </div>
          </section>
        ` : ''}

        <!-- Section 6: Photo & Video Media Gallery -->
        ${p.photos.length > 0 ? `
          <section class="journal-section">
            <h2 class="brand-heading" style="font-size:20px; color:var(--ink);">Media &amp; Prototype Photos</h2>
            <div class="media-grid">
              ${p.photos.map(url => `
                <div class="media-thumb" onclick="openLightbox('${url}')">
                  <img src="${url}" alt="Project Photo" loading="lazy">
                </div>
              `).join('')}
            </div>
          </section>
        ` : ''}

        <!-- Section 7: Code Source & Viewer -->
        <section class="journal-section">
          <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;">
            <h2 class="brand-heading" style="font-size:20px; color:var(--ink);">Python Source Code</h2>
            ${p.code.startsWith('http') ? `<a href="${p.code}" target="_blank" class="btn btn-secondary">💾 Download .HEX / Code</a>` : ''}
          </div>

          <div class="code-box-wrap">
            <div class="code-box-header">
              <span>main.py (micro:bit V2)</span>
              <button class="btn-secondary" style="padding:2px 8px; font-size:11px;" onclick="copyCode(this)">Copy Code</button>
            </div>
            <pre class="code-block"><code>${p.code.startsWith('http') ? '# Source code is attached as an external link above.\n# Click "Download" to fetch the .hex file.' : escapeHtml(p.code || '# No Python code block pasted for this project yet.')}</code></pre>
          </div>
        </section>

        <!-- Section 8: Challenges & Reflection -->
        ${p.challenges ? `
          <section class="journal-section" ${isArabic(p.challenges) ? 'dir="rtl"' : ''}>
            <h2 class="brand-heading" style="font-size:20px; color:var(--ink);">Challenges &amp; Debugging Fixes</h2>
            <p style="font-size:15px; color:var(--plum); line-height:1.6; margin-top:10px;">
              🛠️ ${escapeHtml(p.challenges)}
            </p>
          </section>
        ` : ''}
      `;

      // Render Journal Footer Nav
      content.innerHTML += `
        <div class="journal-footer-nav">
          <button class="btn btn-secondary" onclick="navigateProject(-1)">← Previous Project</button>
          <button class="btn" onclick="showGallery()">Back to Gallery Grid</button>
          <button class="btn btn-secondary" onclick="navigateProject(1)">Next Project →</button>
        </div>
      `;

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ==========================================================================
       AUTO-SCROLL EXHIBITION PRESENTATION MODE (§6)
       ========================================================================== */
    function togglePresentationMode() {
      isPresenting = !isPresenting;
      
      if (isPresenting) {
        document.body.classList.add('presenting');
        if (activeProjectIndex === -1 && filteredProjects.length > 0) {
          openJournal(0);
        }
        
        // Fullscreen request if permitted
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }

        startAutoScrollEngine();
      } else {
        document.body.classList.remove('presenting');
        stopAutoScrollEngine();
        if (document.exitFullscreen && document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }
      }
    }

    function startAutoScrollEngine() {
      stopAutoScrollEngine();
      isPaused = false;
      document.getElementById('presentPlayPauseBtn').innerText = '⏸ Pause';

      currentSectionIndex = 0;
      scrollToCurrentSection();

      autoScrollInterval = setInterval(() => {
        if (isPaused) return;
        nextPresentationSection();
      }, presentSpeed);
    }

    function stopAutoScrollEngine() {
      if (autoScrollInterval) {
        clearInterval(autoScrollInterval);
        autoScrollInterval = null;
      }
    }

    function togglePausePresentation() {
      isPaused = !isPaused;
      document.getElementById('presentPlayPauseBtn').innerText = isPaused ? '▶ Resume' : '⏸ Pause';
    }

    function setPresentSpeed(speedMs, btn) {
      presentSpeed = speedMs;
      document.querySelectorAll('.present-speed-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (isPresenting && !isPaused) startAutoScrollEngine();
    }

    function nextPresentationSection() {
      const sections = document.querySelectorAll('#journalContent .journal-section');
      if (!sections.length) return;

      currentSectionIndex++;
      if (currentSectionIndex >= sections.length) {
        // End of project journal → Move to next project team
        navigateProject(1);
        currentSectionIndex = 0;
      } else {
        scrollToCurrentSection();
      }
    }

    function prevPresentationSection() {
      const sections = document.querySelectorAll('#journalContent .journal-section');
      if (!sections.length) return;

      currentSectionIndex--;
      if (currentSectionIndex < 0) {
        navigateProject(-1);
        currentSectionIndex = 0;
      } else {
        scrollToCurrentSection();
      }
    }

    function scrollToCurrentSection() {
      const sections = document.querySelectorAll('#journalContent .journal-section');
      if (sections[currentSectionIndex]) {
        sections[currentSectionIndex].scrollIntoView({
          behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
          block: 'center'
        });
      }
    }

    function navigateProject(dir) {
      if (filteredProjects.length === 0) return;
      let nextIdx = activeProjectIndex + dir;
      if (nextIdx < 0) nextIdx = filteredProjects.length - 1;
      if (nextIdx >= filteredProjects.length) nextIdx = 0;
      
      openJournal(nextIdx);
      currentSectionIndex = 0;
      if (isPresenting) scrollToCurrentSection();
    }

    function setupKeyboardListeners() {
      document.addEventListener('keydown', (e) => {
        if (!isPresenting) return;
        
        if (e.code === 'Space') {
          e.preventDefault();
          togglePausePresentation();
        } else if (e.code === 'ArrowRight') {
          nextPresentationSection();
        } else if (e.code === 'ArrowLeft') {
          prevPresentationSection();
        } else if (e.code === 'Escape') {
          togglePresentationMode();
        }
      });
    }

    /* ==========================================================================
       UTILITIES & HELPERS
       ========================================================================== */
    function showGalleryView() {
      document.getElementById('galleryView').style.display = 'block';
      document.getElementById('detailView').classList.remove('active');
      activeProjectIndex = -1;
    }

    function hideGalleryView() {
      document.getElementById('galleryView').style.display = 'none';
      document.getElementById('detailView').classList.add('active');
    }

    function showGallery() {
      if (isPresenting) togglePresentationMode();
      showGalleryView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function isArabic(str) {
      return /[\u0600-\u06FF]/.test(str || '');
    }

    function getComponentBadge(compStr) {
      const c = compStr.toLowerCase();
      if (c.includes('servo')) return '⚙️ Servo';
      if (c.includes('soil')) return '🌱 Soil Sensor';
      if (c.includes('ldr') || c.includes('light')) return '💡 LDR';
      if (c.includes('ultrasonic') || c.includes('distance')) return '📏 Ultrasonic';
      if (c.includes('ir') || c.includes('infrared')) return '👁️ IR Sensor';
      return `🔌 ${escapeHtml(compStr)}`;
    }

    function openLightbox(url) {
      document.getElementById('lightboxImg').src = url;
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    function copyCode(btn) {
      const code = btn.parentElement.nextElementSibling.innerText;
      navigator.clipboard.writeText(code).then(() => {
        const orig = btn.innerText;
        btn.innerText = '✓ Copied!';
        setTimeout(() => btn.innerText = orig, 2000);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
